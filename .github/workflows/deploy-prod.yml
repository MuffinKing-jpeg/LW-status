name: Deploy to Live Channel

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: What to publish (manual recovery)
        type: choice
        options: [all, hosting, backend]
        default: all

permissions:
  contents: read

# Do not interrupt an in-flight Cloud Functions deployment.
concurrency:
  group: firebase-production-lw-status
  cancel-in-progress: false

env:
  FIREBASE_PROJECT_ID: lw-status
  CI: 'true'

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      hosting: ${{ steps.targets.outputs.hosting }}
      backend: ${{ steps.targets.outputs.backend }}
      rules: ${{ steps.targets.outputs.rules }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test deployment tooling
        run: node --test .github/scripts/*.test.cjs
      - name: Plan deployments since last successful production run
        id: targets
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/deploy-plan.cjs

  deploy_hosting:
    needs: plan
    if: needs.plan.outputs.hosting == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      # Node 16 is EOL, but still required by the legacy Angular 14 toolchain.
      - name: Set up Node for Angular 14
        uses: actions/setup-node@v4
        with:
          node-version: '16.20.2'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Build production site
        run: npm run build -- --configuration production
      - name: Test frontend
        run: node node_modules/@angular/cli/bin/ng.js test --watch=false --browsers=ChromeHeadless
      - name: Set up Node for Firebase CLI
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Write public build identity
        run: |
          node -e 'require("fs").writeFileSync("public/build-info.json", JSON.stringify({commit: process.env.GITHUB_SHA, builtAt: new Date().toISOString()}))'
      - name: Authenticate to Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LW_STATUS }}
          project_id: ${{ env.FIREBASE_PROJECT_ID }}
      - name: Show deployment identity (no secrets)
        run: node .github/scripts/deploy-identity.cjs
      # No dependency on deploy_backend: a Functions failure cannot block Hosting.
      - name: Publish website only
        run: node .github/scripts/deploy-firebase.cjs hosting
      - name: Verify the published frontend revision
        run: |
          node --input-type=module <<'NODE'
          const sites = [`https://${process.env.FIREBASE_PROJECT_ID}.web.app`, 'https://status.logixy.net'];
          for (const site of sites) {
            let verified = false;
            for (let attempt = 0; attempt < 6; attempt++) {
              try {
                const response = await fetch(`${site}/build-info.json?commit=${process.env.GITHUB_SHA}`, {
                  signal: AbortSignal.timeout(10000), cache: 'no-store'
                });
                if (response.ok && (await response.json()).commit === process.env.GITHUB_SHA) {
                  verified = true;
                  break;
                }
              } catch { /* Give Hosting/CDN propagation a bounded retry. */ }
              if (attempt < 5) await new Promise(resolve => setTimeout(resolve, 5000));
            }
            if (!verified) throw new Error(`${site} is not serving the expected frontend revision`);
            console.log(`Verified ${site}: ${process.env.GITHUB_SHA}`);
          }
          NODE

  deploy_backend:
    needs: plan
    if: needs.plan.outputs.backend == 'true' || needs.plan.outputs.rules == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node for Functions and Firebase CLI
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Check committed Functions migration
        if: needs.plan.outputs.backend == 'true'
        run: |
          node <<'NODE'
          const fs = require('fs');
          const pkg = require('./functions/package.json');
          const major = name => Number((pkg.dependencies[name] || '').match(/\d+/)?.[0] || 0);
          const source = fs.readFileSync('functions/index.js', 'utf8');
          if (pkg.engines.node !== '22' || major('firebase-functions') < 6 ||
              major('firebase-admin') < 13 ||
              !/require\(['"]firebase-functions\/v1['"]\)/.test(source)) {
            throw new Error('Commit the Node 22 / Functions v1 migration; see readme.md');
          }
          NODE
      - name: Install Functions dependencies from lockfile
        if: needs.plan.outputs.backend == 'true'
        run: npm ci --prefix functions
      - name: Check Functions syntax
        if: needs.plan.outputs.backend == 'true'
        run: node --check functions/index.js
      - name: Test backend
        if: needs.plan.outputs.backend == 'true'
        run: npm test --prefix functions
      - name: Authenticate to Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LW_STATUS }}
          project_id: ${{ env.FIREBASE_PROJECT_ID }}
      - name: Show deployment identity (no secrets)
        run: node .github/scripts/deploy-identity.cjs
      - name: Publish backend (independent of website)
        env:
          DEPLOY_FUNCTIONS: ${{ needs.plan.outputs.backend }}
          DEPLOY_RULES: ${{ needs.plan.outputs.rules }}
        run: |
          targets=()
          if [ "$DEPLOY_FUNCTIONS" = true ]; then targets+=(functions); fi
          if [ "$DEPLOY_RULES" = true ]; then targets+=(firestore:rules); fi
          target_list=$(IFS=,; echo "${targets[*]}")
          node .github/scripts/deploy-firebase.cjs "$target_list"

  deployment_summary:
    needs: [plan, deploy_hosting, deploy_backend]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Summarize independent deployment results
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          HOSTING_RESULT: ${{ needs.deploy_hosting.result }}
          BACKEND_RESULT: ${{ needs.deploy_backend.result }}
        run: |
          {
            echo '## Production deployment'
            echo "Commit: $GITHUB_SHA"
            echo ''
            echo '| Target | Result |'
            echo '| --- | --- |'
            echo "| Plan | $PLAN_RESULT |"
            echo "| Website (Hosting) | $HOSTING_RESULT |"
            echo "| Functions / rules | $BACKEND_RESULT |"
            echo ''
            echo 'Website: https://status.logixy.net'
            echo 'Published frontend version: https://status.logixy.net/build-info.json'
            echo 'A backend failure does not roll back a successful Hosting release.'
          } >> "$GITHUB_STEP_SUMMARY"
