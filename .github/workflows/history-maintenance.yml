name: Review short history outages

on:
  push:
    branches: [main]
    paths:
      - functions/history-corrections.js
      - functions/scripts/clean-short-outages.js
      - .github/workflows/history-maintenance.yml
  workflow_dispatch:
    inputs:
      mode:
        description: Preview is read-only; apply requires explicit confirmation
        type: choice
        options: [preview, apply, mark-online, restore]
        default: preview
      days:
        description: Days to inspect (1–30, ignored for restore)
        default: '30'
      confirmation:
        description: Apply EXCLUDE_SINGLE_FAILURES; restore RESTORE_SINGLE_FAILURES
        default: ''
      run_id:
        description: Backup run ID (restore only)
        default: ''
      to:
        description: Reviewed cutoff timestamp in milliseconds (required for mark-online)
        default: ''
      expected_checks:
        description: Reviewed candidate count (required for mark-online)
        default: ''

permissions:
  contents: read
concurrency:
  group: history-maintenance-lw-status
  cancel-in-progress: false

jobs:
  review_history:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOOGLE_CLOUD_PROJECT: lw-status
      FIREBASE_PROJECT_ID: lw-status
      HISTORY_MODE: ${{ inputs.mode || 'preview' }}
      HISTORY_DAYS: ${{ inputs.days || '30' }}
      HISTORY_CONFIRMATION: ${{ inputs.confirmation }}
      HISTORY_RUN_ID: ${{ inputs.run_id }}
    steps:
      - uses: actions/checkout@v4
      # One explicitly authorized correction, restricted to the original preview
      # ending at 16:40 UTC. Every other push remains read-only.
      - name: Select the user-authorized historical correction
        if: github.event_name == 'push' && github.event.head_commit.message == 'Apply requested historical Online corrections (2026-11-09)'
        run: |
          echo 'HISTORY_MODE=mark-online' >> "$GITHUB_ENV"
          echo 'HISTORY_CONFIRMATION=MARK_REVIEWED_FAILURES_ONLINE' >> "$GITHUB_ENV"
          echo 'HISTORY_TO=1794242400000' >> "$GITHUB_ENV"
          echo 'HISTORY_EXPECTED_CHECKS=30' >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Install trusted operator dependencies
        run: npm ci --prefix functions
      - name: Test correction safeguards
        run: npm test --prefix functions
      - name: Authenticate to the project
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LW_STATUS }}
          project_id: lw-status
      - name: Show operator identity (no secrets)
        run: node .github/scripts/deploy-identity.cjs
      - name: Review or apply the explicitly selected operation
        env:
          INPUT_TO: ${{ inputs.to }}
          INPUT_EXPECTED_CHECKS: ${{ inputs.expected_checks }}
        run: |
          args=("$HISTORY_MODE" --days "$HISTORY_DAYS" --confirm "$HISTORY_CONFIRMATION")
          if [ -n "$HISTORY_RUN_ID" ]; then args+=(--run-id "$HISTORY_RUN_ID"); fi
          cutoff="${HISTORY_TO:-$INPUT_TO}"
          expected="${HISTORY_EXPECTED_CHECKS:-$INPUT_EXPECTED_CHECKS}"
          if [ -n "$cutoff" ]; then args+=(--to "$cutoff"); fi
          if [ -n "$expected" ]; then args+=(--expected-checks "$expected"); fi
          node functions/scripts/clean-short-outages.js "${args[@]}"
